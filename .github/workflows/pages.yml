name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be on, with Settings -> Pages -> Source set to
      # GitHub Actions. The workflow token cannot turn it on by itself:
      # configure-pages with enablement returns "Resource not accessible by
      # integration" on this repository.
      - uses: actions/configure-pages@v5

      # The site is plain static files at the repo root; nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
